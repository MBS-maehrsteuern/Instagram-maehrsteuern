<!doctype html><html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="basis.css">
<style>
@font-face{font-family:"Outfit";src:url("schriften/Outfit-Bold.ttf");font-weight:700}
body{width:1080px;height:1350px;position:relative;
  background:radial-gradient(900px 700px at 78% 72%, #1d5546 0%, var(--bg2) 35%, var(--bg) 75%)}
.foto{position:absolute;right:-150px;bottom:0;width:880px;height:880px;object-fit:cover;-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 32%),linear-gradient(to bottom,transparent 0%,#000 22%);-webkit-mask-composite:source-in;mask-composite:intersect}
.oben{position:absolute;left:80px;top:90px;right:80px}
.kicker{font-size:26px}
h1{font-family:"Outfit",var(--sans);font-weight:700;font-size:96px;line-height:1.02;margin:28px 0 0;letter-spacing:-.01em}
h1 .a{color:var(--gruen)}
.unter{font-size:36px;color:var(--text2);margin-top:26px;line-height:1.3;max-width:900px}
.frist{position:absolute;left:80px;bottom:300px;width:520px;padding:30px 34px;border:3px solid var(--gruen);border-radius:28px;
  background:rgba(11,17,14,.78);backdrop-filter:blur(4px)}
.jahr{font-family:"Outfit";font-size:150px;line-height:.9;color:var(--gruen)}
.bis{font-family:var(--mono);font-size:30px;white-space:nowrap;font-weight:600;margin-top:12px}
.tage{display:inline-block;margin-top:18px;font-family:var(--mono);font-size:28px;padding:8px 20px;border-radius:99px;background:var(--rot);color:#1a0d0a;font-weight:700}
.fuss{position:absolute;left:80px;bottom:90px;font-family:var(--mono);font-size:22px;line-height:1.5;color:var(--grau)}
.fuss b{color:var(--text)}
</style></head><body>
<img class="foto" src="../../assets/marke/loris_headshot_1.jpg">
<div class="oben">
  <div class="kicker">Ex-Finanzamt · Steuern × Code</div>
  <h1>Im Finanzamt sah ich jeden Tag, wie Leute <span class="a">Geld verschenken.</span></h1>
  <div class="unter">Nicht, weil sie tricksen –<br>sondern weil sie gar nichts abgeben.</div>
</div>
<div class="frist">
  <div class="jahr">2022</div>
  <div class="bis">freiwillig abgeben bis<br><span class="a" style="font-size:44px">31.12.2026</span></div>
  <div class="tage">Frist läuft ab</div>
</div>
<div class="fuss"><b>Loris Mähr</b><br>Diplom-Finanzwirt · @maehrsteuern</div>
</body></html>
