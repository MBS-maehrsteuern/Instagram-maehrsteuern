<div id="hg"></div><div id="raster"></div>
<div id="gesicht"><img id="gbild"><div class="schatten"></div></div>
<div id="avatar"><div class="ring2"></div><div class="ring"></div><img><div class="name">LORIS MÄHR · DIPLOM-FINANZWIRT</div></div>
<div id="buehne"></div>

<script>
/*SPEC*/
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,t0,d)=>cl((t-t0)/d);
const out3=x=>1-Math.pow(1-x,3), inOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const over=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const hl=s=>s.replace(/\*([^*]+)\*/g,"<em>$1</em>");
$("kicktext").textContent=SPEC.kicker||"";
$("ki").textContent=SPEC.gesicht?"KI-BEARBEITET":"";if(SPEC.avatar)$("avatar").querySelector("img").src=SPEC.avatar;
// ---------- Wind: weiche Luftschlieren, die mit dem Text quer durchs Bild ziehen ----------
const WIND=[];(()=>{const svg=$("wind");const rnd=(i)=>{const x=Math.sin(i*99.13)*43758.5453;return x-Math.floor(x)};
 for(let i=0;i<11;i++){const y=260+rnd(i)*1350, a=40+rnd(i+7)*90, w=3+rnd(i+3)*9;
  const d=`M -300 ${y} C 200 ${y-a}, 520 ${y+a}, 820 ${y-a*.4} S 1250 ${y+a*.6}, 1420 ${y-a*.2}`;
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",d);p.setAttribute("fill","none");
  p.setAttribute("stroke",i%3?"#EEF4F0":"#7FE0C2");p.setAttribute("stroke-width",w);p.setAttribute("stroke-linecap","round");svg.appendChild(p);
  WIND.push({p,L:0,versatz:rnd(i+11)*.22,laenge:.18+rnd(i+5)*.22,op:.28+rnd(i+2)*.42})}
 WIND.forEach(w=>{w.L=w.p.getTotalLength()})})();
function wind(t){ // alle Böen gleichzeitig zeichnen
 let alle=WIND.map(()=>0);
 (SPEC._boeen||[]).forEach(b0=>{const D=.85;if(t<b0||t>b0+D+.3)return;
  WIND.forEach((w,i)=>{const x=P(t,b0+w.versatz*D*.5,D*.8);if(x<=0||x>=1)return;const k=inOut(x);
   w.p.style.strokeDasharray=`${w.L*w.laenge} ${w.L}`;w.p.style.strokeDashoffset=`${w.L*(1-k*(1+w.laenge))+w.L*w.laenge}`;
   alle[i]=Math.max(alle[i],Math.sin(Math.PI*x)*w.op)})});
 WIND.forEach((w,i)=>{w.p.style.opacity=alle[i]});
}
// Text fliegt mit dem Wind ein: von rechts, schräg, unscharf → scharf
function einfliegen(el,t,t0,d=.5,dx=300){const x=P(t,t0,d),k=over(x);el.style.opacity=cl(x*2.2);
 el.style.transform=`translateX(${(1-k)*dx*.55}px) translateY(${(1-out3(x))*24}px) scale(${.92+.08*k})`;el.style.filter=x<1?`blur(${(1-out3(x))*6}px)`:""}
function wegwehen(el,t,t0,d=.2){const x=P(t,t0,d),k=inOut(x);if(x<=0)return false;el.style.opacity=1-k;
 el.style.transform=`translateX(${-k*120}px) scale(${1-.04*k})`;el.style.filter="";return true}
// ---------- Szenen bauen ----------
const B=$("buehne");
function karte(cls,html){return `<div class="karte ${cls||""}">${html}</div>`}
const ICON={
 save:`<svg viewBox="-220 -220 440 440"><circle r="200" fill="rgba(83,195,162,.10)" stroke="rgba(127,224,194,.35)" stroke-width="3" class="ring"/>
  <path class="zieh" d="M -80 -120 L 80 -120 L 80 130 L 0 70 L -80 130 Z" fill="none" stroke="#7FE0C2" stroke-width="16" stroke-linejoin="round"/>
  <path class="fuell" d="M -80 -120 L 80 -120 L 80 130 L 0 70 L -80 130 Z" fill="#53C3A2"/>
  <path class="haken" d="M -38 -20 L -8 12 L 46 -48" fill="none" stroke="#070C0A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 send:`<svg viewBox="-220 -220 440 440"><path class="spur" d="M -200 150 C -120 60, -60 120, 0 30 S 120 -90, 170 -150" fill="none" stroke="#7FE0C2" stroke-width="7" stroke-dasharray="14 18" stroke-linecap="round"/>
  <g class="flieger"><path d="M -70 0 L 80 -60 L 20 80 L 0 20 Z" fill="#EEF4F0"/><path d="M 0 20 L 80 -60 L 20 80 Z" fill="#B9C9C0"/><path d="M 0 20 L 80 -60" stroke="#6F8279" stroke-width="4"/></g></svg>`,
 comment:`<svg viewBox="-220 -220 440 440"><path class="blase" d="M -170 -120 Q -170 -170 -120 -170 L 120 -170 Q 170 -170 170 -120 L 170 60 Q 170 110 120 110 L -40 110 L -110 175 L -95 110 L -120 110 Q -170 110 -170 60 Z" fill="rgba(83,195,162,.16)" stroke="#7FE0C2" stroke-width="10" stroke-linejoin="round"/>
  <circle class="p1" cx="-70" cy="-30" r="20" fill="#7FE0C2"/><circle class="p2" cx="0" cy="-30" r="20" fill="#7FE0C2"/><circle class="p3" cx="70" cy="-30" r="20" fill="#7FE0C2"/>
  <text class="buchst" x="0" y="10" text-anchor="middle" font-family="Outfit" font-size="170" fill="#EEF4F0"></text></svg>`,
 follow:`<svg viewBox="-220 -220 440 440"><circle class="ring" r="180" fill="none" stroke="#53C3A2" stroke-width="14"/>
  <circle cx="0" cy="-45" r="62" fill="#B9C9C0"/><path d="M -110 110 Q -100 20 0 20 Q 100 20 110 110 Z" fill="#B9C9C0"/>
  <g class="plus" transform="translate(120 120)"><circle r="58" fill="#53C3A2"/><path class="pl" d="M -26 0 L 26 0 M 0 -26 L 0 26" stroke="#070C0A" stroke-width="14" stroke-linecap="round"/>
  <path class="hk" d="M -26 2 L -6 22 L 28 -18" fill="none" stroke="#070C0A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`
};
SPEC.szenen.forEach((s,i)=>{const d=document.createElement("div");d.className="szene";d.id="sz"+i;let h="";
 if(s.typ==="titel")h=`<div class="s-titel zeile">${s.h1?`<div class="h1">${hl(s.h1)}</div>`:""}${s.h2?`<div class="h2" style="margin-top:18px">${hl(s.h2)}</div>`:""}</div>`;
 if(s.typ==="gross")h=`<div class="s-gross">${s.ober?`<div class="ober zeile">${s.ober}</div>`:""}<div class="wert zeile" id="wert${i}" style="font-size:${Math.min(s.wgr||230,Math.floor(1700/String(s.wert).length))}px">${s.wert}</div>${s.unter?`<div class="unter zeile">${hl(s.unter)}</div>`:""}</div>`;
 if(s.typ==="liste")h=`<div class="s-liste">${s.kopf?`<div class="kopf zeile">${hl(s.kopf)}</div>`:""}${s.punkte.map((p,j)=>`<div class="punkt karte zeile" id="p${i}_${j}"><div class="nr">${p.nr||j+1}</div><div>${hl(p.t)}${p.u?`<small>${p.u}</small>`:""}</div></div>`).join("")}</div>`;
 if(s.typ==="vs")h=`<div class="s-vs"><div class="vs-k karte schlecht zeile" id="vl${i}"><div class="lab">${s.links.lab}</div><div class="w" style="font-size:${s.links.w.length>6?78:s.links.w.length>4?96:120}px">${s.links.w}</div><div class="t">${s.links.t||""}</div></div>
   <div class="vs-k karte gut zeile" id="vr${i}"><div class="lab">${s.rechts.lab}</div><div class="w" style="font-size:${s.rechts.w.length>6?78:s.rechts.w.length>4?96:120}px">${s.rechts.w}</div><div class="t">${s.rechts.t||""}</div></div></div>`;
 if(s.typ==="mythos")h=`<div class="s-mythos"><div class="karte zeile" style="position:relative"><div class="lab">${s.lab||"MYTHOS"}</div><div class="satz">„${hl(s.satz)}“</div>
   <div class="stempel ${s.stempel_gruen?"gruen":""}" id="st${i}" style="${(s.stempel||"FALSCH").length>8?"font-size:58px;top:-96px;right:10px":""}">${s.stempel||"FALSCH"}</div></div>${s.wahr?`<div class="wahr zeile" id="wa${i}">${hl(s.wahr)}</div>`:""}</div>`;
 if(s.typ==="brief")h=`<div class="s-brief"><div class="brief zeile"><div class="absender">FINANZAMT · ${s.absender||"STEUERNUMMER 123/456/78901"}</div>
   ${s.zeilen.map((z,j)=>`<div class="betreff mark" id="bz${i}_${j}">${z.t}</div><div class="lin" style="width:${88-j*9}%"></div><div class="lin" style="width:${70+j*7}%"></div>`).join("")}<div class="lin" style="width:60%"></div></div></div>`;
 if(s.typ==="datum")h=`<div class="s-datum"><div class="kal karte zeile"><div class="kk">${s.kopf||"FRIST"}</div><div class="tag" id="tag${i}">${s.tag}</div><div class="mon">${s.monat}</div></div>${s.unter?`<div class="unter zeile">${hl(s.unter)}</div>`:""}</div>`;
 if(s.typ==="umfrage")h=`<div class="s-umfrage"><div class="frage zeile">${hl(s.frage)}</div>${s.optionen.map((o,j)=>`<div class="opt karte zeile" id="o${i}_${j}"><b>${o.b}</b>${o.t}</div>`).join("")}</div>`;
 if(s.typ==="cta")h=`<div class="s-cta"><div class="zeile ic" id="ic${i}">${ICON[s.icon]}</div><div class="ct zeile">${hl(s.text)}</div>${s.unter?`<div class="cu zeile">${hl(s.unter)}</div>`:""}</div>`;
 d.innerHTML=h;B.appendChild(d);s._el=d;s._zeilen=[...d.querySelectorAll(".zeile")];
 if(s.typ==="cta"&&s.buchstabe)d.querySelector(".buchst").textContent=s.buchstabe;
});
$("hook").innerHTML=SPEC.hook.map(z=>`<div class="zeile ${z.k||"h1"}">${hl(z.t)}</div>`).join("");
const HZ=[...$("hook").children];
// Gesichtsbilder vorladen
const GF=SPEC.gesicht?Array.from({length:SPEC.gesicht.n},(_,i)=>SPEC.gesicht.ordner+`/g${String(i+1).padStart(4,"0")}.jpg`):[];
GF.forEach(src=>{const im=new Image();im.src=src});
// Untertitel-Gruppen
const W=WOERTER.words;const G=[];let g=[];W.forEach((w,i)=>{g.push(i);if(/[.,:?!]$/.test(w.w)||g.length>=4){G.push(g);g=[]}});if(g.length)G.push(g);
function render(t){
 const GE=SPEC.gesicht_bis;
 // Gesicht: Lip-Sync-Clip läuft synchron zur Stimme, dann weht der Wind es weg
 const ge=$("gesicht");
 if(SPEC.gesicht&&t<GE+.55){const fi=Math.min(SPEC.gesicht.n-1,Math.floor((t+(SPEC.gesicht.versatz||0))*SPEC.gesicht.fps));$("gbild").src=GF[Math.max(0,fi)];
  const z=1.04+.03*P(t,0,GE);ge.style.opacity=1;ge.style.filter="";ge.style.transform=`scale(${z})`;
  if(t>GE){const k=inOut(P(t,GE,.3));ge.style.opacity=1-k;ge.style.transform=`scale(${z-.08*k})`;ge.style.filter=`brightness(${1-.5*k})`}}
 else ge.style.opacity=0;
 // Ohne Lip-Sync: echtes Porträt im Kreis, Ring pulsiert mit der Stimme, Kopf neigt sich leicht
 const av=$("avatar");
 if(SPEC.avatar&&t<GE+.55){const amp=SPEC._amp[Math.min(SPEC._amp.length-1,Math.floor(t*30))]||0;const e=out3(P(t,0,.45));
  av.style.opacity=e;av.querySelector(".ring").style.transform=`scale(${1+.07*amp})`;av.querySelector(".ring").style.opacity=.55+.45*amp;
  av.querySelector(".ring2").style.transform=`scale(${1+.12*amp})`;av.querySelector("img").style.transform=`rotate(${3*Math.sin(t*1.7)}deg) scale(${1.0+.02*amp})`;
  av.style.transform=`scale(${.85+.15*e})`;av.style.filter="";
