<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../kit/brand.css"><script src="../../kit/kit.js"></script>
<style>
  #welt { position:absolute; inset:0; overflow:hidden; }
  .ab { position:absolute; }
  .z { position:absolute; left:0; width:100%; text-align:center; white-space:nowrap; font-family:var(--display); text-transform:uppercase; line-height:1; opacity:0; }
  .w { font-family:var(--fett); }
  .h { font-family:var(--hand); text-transform:none; }
  #flasche { position:absolute; left:0; top:0; width:440px; height:900px; }
</style>
<body>
<div id="welt">
  <svg id="hg" class="ab" style="inset:0" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="flasche"></div>
  <svg id="fx" class="ab" style="inset:0;overflow:visible" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <!-- Beat 1 -->
  <div id="a1" class="z kontur" style="top:560px;color:#fff">Es ist</div>
  <div id="a2" class="z kontur" style="top:760px;color:var(--gelb)">gelb.</div>
  <!-- Beat 2 -->
  <div id="b1" class="z kontur" style="top:470px;color:#fff">Es ist</div>
  <div id="b2" class="z kontur" style="top:650px;color:var(--gelb)">frisch</div>
  <div id="b3" class="z kontur" style="top:875px;color:var(--gelb)">abgefüllt.</div>
  <!-- Beat 3 -->
  <div id="c1" class="z kontur" style="top:340px;color:var(--pink)">Ehrenwort.</div>
  <!-- Bescheid -->
  <div id="d1" class="z kontur" style="top:320px;color:#fff">Du weißt</div>
  <div id="d2" class="z kontur" style="top:495px;color:var(--pink)">Bescheid.</div>
  <!-- Endkarte -->
  <div id="e1" class="z w kontur" style="top:290px;color:var(--gelb)">EHREN</div>
  <div id="e2" class="z w kontur" style="top:578px;color:var(--gelb)">SAFT</div>
  <div id="e3" class="z h kontur" style="top:845px;color:#fff">– bald.</div>
</div>
<div id="hinweis" class="ki-hinweis">Design-Entwurf · Computergrafik</div>
<script>
const {C, prog, ease, lerp, rnd, clamp, flasche, frucht, siegel} = EK;
const $ = id => document.getElementById(id);
// Szenen (Schnitte auf dem Beat, 120 BPM = 0,5 s)
const SZ = [[0, 1.5, "gelb"], [1.5, 3.0, "pink"], [3.0, 4.5, "gelb"], [4.5, 5.5, "pink"], [5.5, 7.0, "gelb"], [7.0, 99, "pink"]];
const szene = t => SZ.findIndex(([a, b]) => t >= a && t < b);
// Texte: id, Szene, Einsatz, Maximalbreite, Wunschgröße
const TX = [["a1", 0, 0.0, 940, 230], ["a2", 0, 0.5, 940, 380],
            ["b1", 1, 1.5, 940, 170], ["b2", 1, 2.0, 940, 210], ["b3", 1, 2.5, 940, 210],
            ["c1", 2, 3.0, 940, 230],
            ["d1", 3, 4.5, 940, 170], ["d1", 4, 5.5, 940, 170], ["d2", 4, 5.5, 940, 200],
            ["e1", 5, 7.0, 900, 250], ["e2", 5, 7.25, 900, 250], ["e3", 5, 7.75, 900, 150]];
let gepasst = false;
function passen() { // Schrift so groß wie möglich, ohne über 940 px Breite zu gehen
  TX.forEach(([id, , , maxB, fs]) => { const el = $(id); if (el.dataset.ok) return; el.style.fontSize = fs + "px"; el.style.width = "auto"; el.style.display = "inline-block";
    let w = el.getBoundingClientRect().width; if (w > maxB) el.style.fontSize = (fs * maxB / w).toFixed(1) + "px";
    el.style.width = "100%"; el.style.display = "block"; el.dataset.ok = 1; });
  gepasst = true;
}
const g = rnd(33), sticker = [];
for (let i = 0; i < 12; i++) sticker.push({ a: i / 12 * Math.PI * 2, r: 0, art: i % 2 ? "himbeere" : "zitrone", gr: 40 + g() * 30, ph: g() * 6 });

function hintergrund(t, sz) {
  const farbe = SZ[sz][2], grund = farbe === "gelb" ? C.gelb : C.pink, streifen = farbe === "gelb" ? C.gelbTief : C.pinkTief;
  let s = `<rect width="1080" height="1920" fill="${grund}"/>`;
  const richtung = sz % 2 ? -1 : 1;
  for (let i = -6; i < 16; i++) s += `<rect x="${i * 180 + ((t * 300 * richtung) % 180 + 180) % 180}" y="-400" width="60" height="2800" fill="${streifen}" opacity=".35" transform="rotate(${sz % 2 ? -22 : 22} 540 960)"/>`;
  // Fruchtsticker am Rand, kreisen langsam
  sticker.forEach((k, i) => {
    const seite = i % 2 ? 1 : -1, y = ((i * 170 + t * 120 * (i % 3 + 1)) % 2100) - 90, x = 540 + seite * (470 + Math.sin(t * 2 + k.ph) * 30);
    s += `<g transform="translate(${x.toFixed(0)},${y.toFixed(0)}) rotate(${(t * 90 * seite + k.ph * 40).toFixed(0)})">${frucht(k.art, k.gr)}</g>`;
  });
  // große Frucht unten in den reinen Textszenen
  if (sz === 0 || sz === 1) { const q = ease.back(prog(t, SZ[sz][0], .4));
    s += `<g transform="translate(540,${lerp(1900, 1260, q)}) rotate(${t * 70}) scale(${q})">${frucht(sz === 0 ? "zitrone" : "himbeere", sz === 0 ? 230 : 190)}</g>`; }
  return s;
}
function zeigen(id, t, t0, sz, aktiv) {
  const el = $(id);
  if (!aktiv || t < t0) { el.style.opacity = 0; return; }
  const q = prog(t, t0, .22), wackel = Math.sin(t * 9 + t0) * 1.6;
  el.style.opacity = 1;
  el.style.transform = `scale(${lerp(1.5, 1, ease.out(q))}) rotate(${lerp(sz % 2 ? 9 : -9, 0, ease.out(q)) + wackel}deg)`;
}
window.zeichne = t => {
  if (!gepasst) passen();
  const sz = szene(t), t0 = SZ[sz][0];
  // Kamera-Punch bei jedem Schnitt + bei jedem Worteinsatz
  let punch = 0; TX.forEach(([, , e]) => { const d = t - e; if (d >= 0 && d < .3) punch = Math.max(punch, 1 - d / .3); });
  const zoom = 1 + .06 * punch * punch + .01 * Math.sin(t * 6);
  const sh = 14 * punch * punch;
  $("welt").style.transform = `translate(${Math.sin(t * 97) * sh}px,${Math.cos(t * 83) * sh}px) scale(${zoom})`;
  $("hg").innerHTML = hintergrund(t, sz);
  // Texte
  const geseh = {};
  TX.forEach(([id, s, e]) => { if (s === sz) { zeigen(id, t, Math.max(e, t0), sz, true); geseh[id] = 1; } else if (!geseh[id]) zeigen(id, t, e, sz, false); });
  // Flasche: rutscht in Szene 3 rein (Zwinker-Wackler), bleibt bis Szene 5, Endkarte unten klein
  const fl = $("flasche"); const H = 900, boden = H * (995 / 1040);
  let fx = "";
  if (sz === 2 || sz === 3 || sz === 4) {
    const q = prog(t, 3.5, .45), x = lerp(1300, 0, ease.out(q));
    const dz = t - 3.95, zw = dz > 0 ? Math.sin(dz * 26) * 15 * Math.exp(-dz * 4.5) : 0;      // Wackler
    const zwinker = prog(t, 4.15, .3), kipp = Math.sin(zwinker * Math.PI) * -14;            // „Zwinkern“: kurzes Kippen + Stauchen
    const yl = 0;
    const sk = sz === 2 ? 1 : lerp(1, .85, ease.inOut(prog(t, 4.5, .35)));
    fl.style.opacity = 1;
    fl.innerHTML = flasche({ welle: t * 7 + zw * .3, fruechte: 9 });
    fl.style.transformOrigin = `50% ${boden}px`;
    fl.style.transform = `translate(${320 + x}px,${1470 - boden + yl}px) rotate(${(x > 0 ? 18 : 0) * (1 - q) + zw + kipp}deg) scale(${sk * (1 + Math.sin(zwinker * Math.PI) * .05)},${sk * (1 - Math.sin(zwinker * Math.PI) * .07)})`;
    // Zwinker-Glanz am Kronkorken
    const gz = prog(t, 4.15, .45);
    if (gz > 0 && gz < 1) { const r = Math.sin(gz * Math.PI) * 70, cx = 700, cy = 640;
      fx += `<g transform="translate(${cx},${cy}) rotate(${gz * 90})"><path d="M0,${-r} L${r * .22},${-r * .22} L${r},0 L${r * .22},${r * .22} L0,${r} L${-r * .22},${r * .22} L${-r},0 L${-r * .22},${-r * .22}Z" fill="#fff" stroke="${C.tinte}" stroke-width="5"/></g>`; }
    // Speedlines beim Reinrutschen
    if (q > 0 && q < 1) for (let i = 0; i < 6; i++) fx += `<line x1="${560 + x + 120}" y1="${780 + i * 110}" x2="${560 + x + 480}" y2="${780 + i * 110}" stroke="${C.tinte}" stroke-width="10" stroke-linecap="round" opacity="${(1 - q) * .8}"/>`;
  } else if (sz === 5) {
    const q = ease.back(prog(t, 7.4, .45)), sk = .56;
    fl.style.opacity = 1;
    fl.innerHTML = flasche({ welle: t * 7, fruechte: 9 });
    fl.style.transformOrigin = `50% ${boden}px`;
    fl.style.transform = `translate(320px,${1480 - boden + lerp(700, 0, q)}px) rotate(${Math.sin(t * 4) * 5}deg) scale(${sk})`;
  } else fl.style.opacity = 0;
  // Ehrenwort: Siegel knallt drauf
  if (sz === 2) { const q = prog(t, 3.0, .3), r = 230 * lerp(2.2, 1, ease.out(q)) * (1 - ease.inOut(prog(t, 3.45, .2)) * .45);
    const x = lerp(540, 250, ease.inOut(prog(t, 3.45, .3))), y = lerp(990, 900, ease.inOut(prog(t, 3.45, .3)));
    fx = `<g transform="translate(${x},${y}) rotate(${lerp(-60, -8, ease.out(q)) + Math.sin(t * 3) * 4})">${siegel(r, "EHRENWORT")}</g>` + fx; }
  // Endkarte: Flasche klein zwischen den Zeilen? -> Siegel „BALD“ + fallende Früchte
  if (sz === 5) {
    const q = prog(t, 7.75, .3);
    fx += `<g transform="translate(850,1250) rotate(${lerp(-50, 12, ease.out(q)) + Math.sin(t * 3) * 5}) scale(${q > 0 ? lerp(2, 1, ease.out(q)) : 0})">${siegel(110, "EHRE")}</g>`;
    const g2 = rnd(8);
    for (let i = 0; i < 10; i++) { const x = 90 + g2() * 900, sp = 300 + g2() * 300, y = -100 + ((t - 7) * sp + g2() * 400), rot = (t * 200 * (g2() - .5)).toFixed(0);
      if (y < 1450) fx += `<g transform="translate(${x.toFixed(0)},${y.toFixed(0)}) rotate(${rot})">${frucht(i % 2 ? "himbeere" : "zitrone", 36 + g2() * 20)}</g>`; }
  }
  $("fx").innerHTML = fx;
  // Endkarte: Wortmarke atmet
  if (sz === 5) { ["e1", "e2"].forEach((id, i) => $(id).style.transform += ` scale(${1 + .03 * Math.sin(t * Math.PI * 2 + i)})`); }
};
</script>
