<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../kit/brand.css"><script src="../kit/kit.js"></script>
<body><div id="b" style="position:absolute;left:290px;top:420px;width:500px;height:1080px"></div>
<svg id="s" style="position:absolute;inset:0" viewBox="0 0 1080 1920"></svg>
<div class="schlagzeile kontur" style="position:absolute;top:120px;width:100%;text-align:center;font-size:170px;color:#FF2E7E">Du weißt<br>Bescheid.</div>
<div class="ki-hinweis">Design-Entwurf · KI-/Computergrafik</div>
<script>window.zeichne=t=>{const {prog,ease,flasche,splash}=EK;const p=ease.bounce(prog(t,0,.9));
document.getElementById('b').style.transform=`translateY(${(1-p)*-1500}px) rotate(${Math.sin(t*3)*2}deg)`;
document.getElementById('b').innerHTML=flasche({welle:t*6});
document.getElementById('s').innerHTML=`<g transform="translate(540,1500)">${splash(prog(t,.32,1.3))}</g>`;}</script>
