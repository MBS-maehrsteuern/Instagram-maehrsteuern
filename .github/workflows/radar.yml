name: Radar
# Täglich morgens: Arbeitsliste fürs Kommentieren/DMs/Collab als Issue (automatik/radar.py)
# und LinkedIn-Pakete für freigegebene Karussells (automatik/linkedin.py). Postet und schreibt nie selbst.
# Hauptauslöser ist lage.yml (07:00–10:00 Uhr deutscher Zeit, falls heute noch kein Lauf); der Zeitplan hier ist Reserve.
# GitHub startet die Reserve oft 6–9 h zu spät: radar.py legt deshalb kein zweites Issue am selben Tag an und schließt
# das Morgen-Issue nicht (Ausnahme: Handstart mit „erzwingen“). LinkedIn-Pakete laufen trotzdem (nur fehlende).
on:
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Auch dann ein neues Radar-Issue anlegen, wenn heute schon eines erstellt wurde"
        type: boolean
        default: false
concurrency:
  group: radar
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  radar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: claude/instagram }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -q requests pillow anthropic
      - run: git config user.name "Loris M." && git config user.email "mkwloris@googlemail.com"
      - name: Radar
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_IG_USER_ID: ${{ secrets.FB_IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RADAR_ERZWINGEN: ${{ inputs.erzwingen && '1' || '' }}
        run: python automatik/radar.py
      - name: Vorbilder (1× pro Woche, nur lesen)
        if: always()
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_IG_USER_ID: ${{ secrets.FB_IG_USER_ID }}
        run: |
          python automatik/vorbilder.py
          git add recherche
          git diff --cached --quiet && exit 0
          git commit -qm "Vorbilder-Radar: Ausreißer der Woche"
          for i in 1 2 3 4; do git pull -q --rebase origin claude/instagram && git push -q origin HEAD:claude/instagram && exit 0; sleep $((i*5)); done
          exit 1
      - name: LinkedIn-Pakete
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python automatik/linkedin.py
